name: Unit tests
on:
  push:
    branches-ignore:
      - main
  pull_request: 

jobs:
  run_unit_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db


    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12.3'

      - name: Install python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests with Coverage
        run: |
          coverage run -m pytest -v --junitxml=results.xml
          coverage xml
      
      - name: Generate custom badges
        run: |
          genbadge coverage -i coverage.xml -o custom_badges/coverage-badge.svg
          genbadge tests -i results.xml -o custom_badges/tests-badge.svg
